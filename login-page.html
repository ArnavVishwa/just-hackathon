<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brew Haven — Login</title>
  <link rel="stylesheet" href="login-page.css">
</head>

<body>
  <div class="page-shell">

    <header class="site-header">
      <a href="#" class="brand">Brew Haven</a>

      <nav class="main-nav" aria-label="Main navigation">
        <a href="#">HOME</a>
        <a href="#">MENU</a>
        <a href="#">ABOUT</a>
        <a href="#">BLOG</a>
        <a href="#">CONTACT</a>
      </nav>

      <div class="header-actions" aria-label="Header actions">
        <button class="icon-button" type="button" aria-label="Search">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="10.8" cy="10.8" r="6.2"></circle>
            <path d="M15.5 15.5 21 21"></path>
          </svg>
        </button>

        <button class="icon-button" type="button" aria-label="Messages">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5.2 5.2h10.9a3 3 0 0 1 3 3v6.1a3 3 0 0 1-3 3H11l-4.7 2.7v-2.7H5.2a3 3 0 0 1-3-3V8.2a3 3 0 0 1 3-3Z"></path>
            <path d="M8.5 10.5h6.5M8.5 13.2h4.2"></path>
          </svg>
        </button>

        <button class="icon-button" type="button" aria-label="Saved items">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6.2 4.2h10.7a2 2 0 0 1 2 2v13.3l-7.3-4.3-7.3 4.3V6.2a2 2 0 0 1 1.9-2Z"></path>
            <path d="M15.8 8.7v4.7M13.5 11h4.6"></path>
          </svg>
        </button>
      </div>
    </header>

    <main class="login-main">
      <section class="login-panel" aria-labelledby="login-title">
        <div class="form-wrap">
          <h1 id="login-title">Welcome Back</h1>
          <p class="subtitle">Login to your account</p>

          <form class="login-form">
            <div class="field">
              <label for="email">Email Address</label>
              <input id="email" name="email" type="email" autocomplete="email"
                     placeholder="Enter your email">
            </div>

            <div class="field password-field">
              <label for="password">Password</label>
              <input id="password" name="password" type="password"
                     autocomplete="current-password" placeholder="Enter your password">
            </div>

            <div class="form-options">
              <label class="remember">
                <input type="checkbox" name="remember">
                <span class="custom-checkbox" aria-hidden="true"></span>
                <span>Remember Me</span>
              </label>

              <a href="#" class="forgot-link">Forgot Password?</a>
            </div>

            <div class="divider">
              <span>or continue with</span>
            </div>

            <div class="social-login" aria-label="Social login options">
              <button class="social google" type="button" aria-label="Continue with Google">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path fill="#4285F4" d="M23.49 12.27c0-.79-.07-1.55-.2-2.27H12v4.3h6.45a5.52 5.52 0 0 1-2.39 3.62v3h3.87c2.27-2.09 3.56-5.17 3.56-8.65Z"/>
                  <path fill="#34A853" d="M12 24c3.24 0 5.95-1.07 7.93-2.9l-3.87-3c-1.07.72-2.44 1.14-4.06 1.14-3.12 0-5.76-2.11-6.71-4.94H1.29v3.09A12 12 0 0 0 12 24Z"/>
                  <path fill="#FBBC05" d="M5.29 14.3A7.22 7.22 0 0 1 4.91 12c0-.8.14-1.58.38-2.3V6.61H1.29A12 12 0 0 0 0 12c0 1.94.46 3.77 1.29 5.39l4-3.09Z"/>
                  <path fill="#EA4335" d="M12 4.76c1.77 0 3.36.61 4.61 1.81l3.45-3.45C17.94 1.15 15.23 0 12 0A12 12 0 0 0 1.29 6.61l4 3.09C5.24 6.87 8.88 4.76 12 4.76Z"/>
                </svg>
              </button>

              <button class="social facebook" type="button" aria-label="Continue with Facebook">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <circle cx="12" cy="12" r="12" fill="#1877F2"/>
                  <path fill="#fff" d="M13.65 21v-8h2.68l.4-3.13h-3.08v-2c0-.91.25-1.53 1.55-1.53h1.66V3.54c-.29-.04-1.3-.13-2.48-.13-2.45 0-4.13 1.5-4.13 4.25v2.21H7.48V13h2.77v8h3.4Z"/>
                </svg>
              </button>

              <button class="social apple" type="button" aria-label="Continue with Apple">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path fill="currentColor" d="M16.84 12.7c0-2.07 1.69-3.07 1.77-3.12a3.82 3.82 0 0 0-3-1.63c-1.27-.13-2.5.76-3.15.76-.65 0-1.66-.74-2.73-.72a4.02 4.02 0 0 0-3.39 2.06c-1.46 2.53-.37 6.27 1.05 8.33.69 1.01 1.52 2.14 2.6 2.1 1.04-.04 1.43-.67 2.69-.67 1.25 0 1.61.67 2.7.65 1.12-.02 1.84-1.01 2.5-2.02a8.31 8.31 0 0 0 1.14-2.35 3.63 3.63 0 0 1-2.18-3.39Zm-2.07-6.1a3.64 3.64 0 0 0 .83-2.61 3.7 3.7 0 0 0-2.39 1.24 3.46 3.46 0 0 0-.85 2.51 3.06 3.06 0 0 0 2.41-1.14Z"/>
                </svg>
              </button>
            </div>

            <p class="signup">Don’t have an account? <a href="#">Sign up</a></p>
          </form>
        </div>
      </section>

      <aside class="coffee-visual" aria-hidden="true">
        <img class="coffee-image" src="coffee-cup.png" alt="">
      </aside>
    </main>
  </div>
</body>
</html>
